<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>souloveryall</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030304;
            --card-bg: rgba(255, 255, 255, 0.03); 
            --border: rgba(255, 255, 255, 0.06); 
            --border-active: rgba(255, 255, 255, 0.15);
            --text-main: #8a8a8e; 
            --text-bright: #f3f4f6;
            --fog-color: rgba(140, 140, 150, 0.25); 
        }

        * { box-sizing: border-box; cursor: default; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.15;
            pointer-events: none;
            z-index: 20;
        }

        .ambient-fog {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 45%, var(--fog-color) 0%, rgba(3, 3, 4, 0) 75%);
            z-index: 1;
            animation: breathe 8s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .container {
            position: relative;
            z-index: 25;
            width: 100%;
            max-width: 650px;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 65px;
            font-weight: 700;
            letter-spacing: -4px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #262a33 0%, #8e949e 50%, #262a33 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 10s linear infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        .version-box {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .version {
            font-size: 12px;
            color: #666;
            letter-spacing: 0.5px;
            font-weight: 300;
        }

        .discord-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #555;
            text-decoration: none;
            padding: 6px 16px;
            border-radius: 100px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.02);
            transition: 0.3s;
            margin-bottom: 45px;
            backdrop-filter: blur(10px);
            cursor: pointer;
        }

        .discord-btn:hover {
            color: var(--text-bright);
            border-color: var(--border-active);
            background: rgba(255,255,255,0.05);
        }

        .label {
            font-size: 10px;
            font-weight: 600;
            color: #666;
            letter-spacing: 7px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            text-decoration: none;
            display: flex;
            align-items: center;
            transition: all 0.5s cubic-bezier(0.15, 0.85, 0.35, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(20px);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.02);
            cursor: pointer;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--border-active);
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .full-dump {
            width: 100%;
            padding: 30px;
            margin-bottom: 15px;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .grid-footer {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 66.6%;
            margin: 15px auto 0;
        }

        .small-btn {
            flex-direction: column;
            padding: 25px 10px;
            gap: 12px;
        }

        .icon-box {
            position: relative;
            width: 26px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2px;
        }

        .icon-box i { font-size: 24px; color: #333; transition: 0.4s; }
        .btn:hover .icon-box i { color: #8e949e; }

        .icon-label {
            position: absolute;
            bottom: 5px;
            font-weight: 800;
            font-size: 6px;
            letter-spacing: -0.2px;
            color: var(--bg);
            transition: 0.4s;
        }

        .json-brackets {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 7px;
            font-weight: 800;
            color: var(--bg);
        }

        .btn-title { font-size: 17px; font-weight: 500; color: #666; transition: 0.4s; }
        .btn:hover .btn-title { color: var(--text-bright); }
        .btn-desc { font-size: 10px; color: #55555a; margin-top: 3px; }
    </style>
</head>
<body>

    <div class="ambient-fog"></div>

    <div class="container">
        <h1>souloveryall</h1>
        
        <div class="version-box">
            <div class="version">RobloxPlayer: <span id="player-version">version-fetching...</span></div>
            <div class="version">RobloxStudio: <span id="studio-version">version-fetching...</span></div>
        </div>
        
        <a href="https://discord.gg/HTb4BhcZRP" target="_blank" class="discord-btn">
            <i class="fab fa-discord"></i> Discord
        </a>

        <div class="label">fflags offsets</div>

        <a href="https://raw.githubusercontent.com/souloveryall/FullDump.hpp/refs/heads/main/exclusive.hpp" target="_blank" class="btn full-dump">
            <div class="icon-box">
                <i class="fa-solid fa-file"></i>
                <span class="icon-label">C++</span>
            </div>
            <span class="btn-title">fulldump.hpp</span>
        </a>

        <div class="grid">
            <a href="https://raw.githubusercontent.com/souloveryall/offsets.hpp/refs/heads/main/Offsets.hpp" target="_blank" class="btn small-btn">
                <div class="icon-box">
                    <i class="fa-solid fa-file"></i>
                    <span class="icon-label">C++</span>
                </div>
                <span class="btn-title">.hpp</span>
                <span class="btn-desc">Full Offsets</span>
            </a>

            <a href="https://raw.githubusercontent.com/souloveryall/PureOffsets.hpp/refs/heads/main/PRoffsets.hpp" target="_blank" class="btn small-btn">
                <div class="icon-box">
                    <i class="fa-solid fa-file"></i>
                    <span class="icon-label">C++</span>
                </div>
                <span class="btn-title">.hpp</span>
                <span class="btn-desc">Pure Offsets</span>
            </a>

            <a href="https://raw.githubusercontent.com/souloveryall/RobloxStudio.hpp/refs/heads/main/rblxstudio.hpp" target="_blank" class="btn small-btn">
                <div class="icon-box">
                    <i class="fa-solid fa-file"></i>
                    <span class="icon-label">C++</span>
                </div>
                <span class="btn-title">.hpp</span>
                <span class="btn-desc">RobloxStudio</span>
            </a>
        </div>

        <div class="grid-footer">
            <a href="https://raw.githubusercontent.com/souloveryall/JSONOffsets.json/refs/heads/main/Offsets.json" target="_blank" class="btn small-btn">
                <div class="icon-box">
                    <i class="fa-solid fa-file"></i>
                    <span class="json-brackets">&lt; &gt;</span>
                </div>
                <span class="btn-title">.json</span>
                <span class="btn-desc">JSON Offsets</span>
            </a>

            <a href="https://raw.githubusercontent.com/souloveryall/DataBase.json/refs/heads/main/database.json" target="_blank" class="btn small-btn">
                <div class="icon-box">
                    <i class="fa-solid fa-file"></i>
                    <span class="json-brackets">&lt; &gt;</span>
                </div>
                <span class="btn-title">.json</span>
                <span class="btn-desc">FFlags Database</span>
            </a>
        </div>
    </div>

    <script>
        const PLAYER_VRS_URL = 'https://raw.githubusercontent.com/souloveryall/version/refs/heads/main/vrs.txt';
        const STUDIO_VRS_URL = 'https://raw.githubusercontent.com/souloveryall/studioversion/refs/heads/main/stdvrs.txt';

        async function fetchVersion(url, elementId) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error();
                const text = await response.text();
                document.getElementById(elementId).textContent = 'version-' + text.trim();
            } catch {
                document.getElementById(elementId).textContent = 'version-error';
                document.getElementById(elementId).style.color = '#ff4444';
            }
        }

        fetchVersion(PLAYER_VRS_URL, 'player-version');
        fetchVersion(STUDIO_VRS_URL, 'studio-version');
    </script>
</body>
</html>
